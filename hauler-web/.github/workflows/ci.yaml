name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: haulerweb
          POSTGRES_PASSWORD: haulerweb
          POSTGRES_DB: haulerweb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U haulerweb"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HAULERWEB_TEST_DATABASE_URL: postgres://haulerweb:haulerweb@localhost:5432/haulerweb?sslmode=disable
      HAULERWEB_TEST_HAULER_BIN: /usr/local/bin/hauler
      # Keep in step with the Dockerfile's HAULER_VERSION.
      HAULER_VERSION: 2.0.3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...

      - name: Install hauler
        run: |
          curl -sfL https://get.hauler.dev | HAULER_VERSION="${HAULER_VERSION}" bash
          hauler version

      # Unit tests: no database, no network, no hauler binary.
      - name: Unit tests
        run: go test ./... -race -covermode=atomic -coverprofile=coverage.out

      # Integration: real Postgres, real hauler binary.
      - name: Integration tests
        run: go test -tags=integration ./... -race -count=1

      # The acceptance gate. Runs the real binary against in-process registries
      # and the service Postgres, and asserts that a second reconcile over
      # unchanged inputs pulls nothing. Everything else can pass while this
      # fails, and if it does the product does not work.
      - name: End-to-end acceptance
        run: go test -tags=e2e ./... -race -count=1 -v

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t hauler-web:ci .

      # The trivial check that would have caught a CMD naming a subcommand
      # that does not exist: start the container and see whether it stays up.
      - name: Container starts and the CLI works
        run: |
          docker run --rm hauler-web:ci version
          docker run --rm hauler-web:ci --help
          # `worker` without a database must fail with a clear message rather
          # than panic, and must not hang.
          if timeout 30 docker run --rm hauler-web:ci worker 2>&1 | tee /tmp/out; then
            echo "expected worker to exit non-zero without a database"; exit 1
          fi
          grep -qi "database url is required" /tmp/out
