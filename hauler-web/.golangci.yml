version: "2"
linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - errorlint
    - misspell
    - unconvert
  exclusions:
    rules:
      # Test helpers legitimately ignore cleanup errors.
      - path: _test\.go
        linters: [errcheck]
formatters:
  enable:
    - gofmt
