# Local development stack. Kubernetes deployment uses the Helm chart instead.
#
# minio stands in for S3 and registry:2 for the destination registry, so the
# whole pull -> push -> archive path is exercisable without external services.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: haulerweb
      POSTGRES_PASSWORD: haulerweb
      POSTGRES_DB: haulerweb
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haulerweb"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: haulerweb
      MINIO_ROOT_PASSWORD: haulerweb123
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  # Two registries: one standing in for "upstream", one for the destination.
  # The e2e suite needs both, and keeping them local means the suite never
  # reaches the internet -- the right property for a test of an airgap tool.
  registry-upstream:
    image: registry:2
    ports: ["5001:5000"]
    volumes: ["upstreamdata:/var/lib/registry"]

  registry-dest:
    image: registry:2
    ports: ["5002:5000"]
    volumes: ["destdata:/var/lib/registry"]

  # Applies migrations, then exits. The worker waits on it.
  migrate:
    build: {context: .., dockerfile: Dockerfile}
    command: ["migrate"]
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      HAULERWEB_DATABASE_URL: postgres://haulerweb:haulerweb@postgres:5432/haulerweb?sslmode=disable

  hauler-web:
    build:
      context: ..
      dockerfile: Dockerfile
    # `worker` is the image default; named here so the compose file documents
    # what this container actually does.
    command: ["worker"]
    depends_on:
      postgres: {condition: service_healthy}
      minio:    {condition: service_healthy}
      migrate:  {condition: service_completed_successfully}
    environment:
      HAULERWEB_DATABASE_URL: postgres://haulerweb:haulerweb@postgres:5432/haulerweb?sslmode=disable
      HAULERWEB_LOG_LEVEL: debug
      HAULERWEB_POLL_INTERVAL: 1m
    ports: ["8080:8080"]
    volumes:
      - storedata:/var/lib/hauler-web/store
      - workdata:/var/lib/hauler-web/work

volumes:
  pgdata:
  miniodata:
  upstreamdata:
  destdata:
  storedata:
  workdata:
